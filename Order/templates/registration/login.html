<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — TruckFix</title>
    <a href="{% url 'register' %}" class="back-link">Don't have an account? Register here</a>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #adbac7;
            --accent-blue: #58a6ff;
            --accent-green: #238636;
            --border-color: #30363d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        h2 { color: white; margin-bottom: 30px; font-size: 28px; text-align: center; }

        .form-group { margin-bottom: 20px; }

        label { display: block; margin-bottom: 8px; font-size: 14px; color: #768390; }

        input {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        input:focus {
            border-color: var(--accent-blue);
            outline: none;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-green);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #2ea043;
            transform: translateY(-2px);
        }

        .errorlist {
            color: #f85149;
            list-style: none;
            padding: 10px;
            background: rgba(248, 81, 73, 0.1);
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        .back-link {
            display: block;
            margin-top: 25px;
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>TruckFix</h2>

        <form method="post">
            {% csrf_token %}

            {% if form.errors %}
                <div class="errorlist">
                    Invalid username or password.
                </div>
            {% endif %}

            <div class="form-group">
                <label for="id_username">Username</label>
                {{ form.username }}
            </div>

            <div class="form-group">
                <label for="id_password">Password</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <a href="{% url 'index' %}" class="back-link">← Back to Menu</a>
    </div>

</body>
</html>
