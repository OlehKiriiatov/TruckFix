<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход | TruckFix</title>
    <!-- Сюда вставь свой старый CSS -->
    <style>
        /* Твой старый стиль */
        body { background: #222; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .login-form { display: inline-block; background: #333; padding: 20px; border-radius: 10px; }
        input { display: block; margin: 10px auto; padding: 10px; width: 200px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #ff9900; border: none; cursor: pointer; font-weight: bold; }
        .error-text { color: #ff4444; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="login-form">
        <h2>ВХОД В СИСТЕМУ</h2>

        <!-- ВАЖНО: method="POST" и отсутствие action (значит шлет на этот же URL) -->
        <form method="POST">
            {% csrf_token %}

            {% if error %}
                <div class="error-text">{{ error }}</div>
            {% endif %}

            <!-- ВАЖНО: name="username" -->
            <input type="text" name="username" placeholder="Логин" required>

            <!-- ВАЖНО: name="password" -->
            <input type="password" name="password" placeholder="Пароль" required>

            <button type="submit">ВОЙТИ</button>
        </form>
    </div>

</body>
</html>
