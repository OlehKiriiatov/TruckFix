<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <style>
        body { background: #222; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .login-box { display: inline-block; background: #333; padding: 30px; border-radius: 10px; }
        input { display: block; margin: 10px auto; padding: 10px; width: 200px; }
        button { padding: 10px 20px; background: orange; border: none; cursor: pointer; }
        .err { color: red; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>ВХОД</h2>
        <form method="POST">
            {% csrf_token %}

            {% if error %}
                <p class="err">{{ error }}</p>
            {% endif %}

            <input type="text" name="username" placeholder="Логин" required>
            <input type="password" name="password" placeholder="Пароль" required>
            <button type="submit">ВОЙТИ</button>
        </form>
    </div>
</body>
</html>
