{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruckFix — Main Menu</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #adbac7;
            --accent-blue: #58a6ff;
            --accent-green: #238636;
            --border-color: #30363d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .menu-card {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
        }

        .hero-banner {
            width: 100%;
            height: 220px;
            background-image: linear-gradient(to bottom, rgba(0,0,0,0) 10%, var(--card-bg) 100%),
                              url('https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?q=80&w=800&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .brand-name {
            color: var(--accent-blue);
            font-size: 42px;
            font-weight: 900;
            margin: 0 0 15px 0;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .content { padding: 10px 30px 35px 30px; }
        .menu-stack { display: flex; flex-direction: column; gap: 12px; }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 15px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border-color);
        }

        .btn-secondary { background-color: #21262d; color: #c9d1d9; }
        .btn-secondary:hover { background-color: #30363d; border-color: #8b949e; transform: translateY(-2px); }

        .btn-mechanic { background-color: var(--accent-green); border-color: #2ea043; color: white; }
        .btn-mechanic:hover { background-color: #2ea043; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(35, 134, 54, 0.4); }

        .btn-auth {
            background-color: transparent;
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
        }
        .btn-auth:hover { background-color: rgba(88, 166, 255, 0.1); border-color: #79c0ff; }

        .user-section {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid var(--border-color);
        }

        .status-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            color: #768390;
            margin-bottom: 20px;
        }

        .dot { width: 8px; height: 8px; background-color: #3fb950; border-radius: 50%; box-shadow: 0 0 8px #3fb950; }
        .username { color: white; font-weight: 700; }
    </style>
</head>
<body>

    <div class="menu-card">
        <div class="hero-banner">
            <h1 class="brand-name">TruckFix</h1>
        </div>

        <div class="content">
            <div class="menu-stack">
                <a href="{% url 'mech_call' %}" class="btn btn-secondary"><span>🛠️</span> Call a Mechanic</a>

                {% if user.is_authenticated and user.is_staff %}
                <a href="{% url 'mechanic_dashboard' %}" class="btn btn-mechanic"><span>📊</span> Mechanic Dashboard</a>
                {% endif %}

                <a href="{% url 'my_orders' %}" class="btn btn-secondary"><span>📜</span> My Orders</a>
            </div>

            <div class="user-section">
                {% if user.is_authenticated %}
                    <!-- Вид для залогиненного пользователя -->
                    <div class="status-header">
                        <span class="dot"></span>
                        <span>Welcome, <span class="username">{{ user.username }}</span></span>
                    </div>
                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-auth" style="width: 100%; cursor: pointer;">Logout</button>
                    </form>
                {% else %}
                    <!-- Вид для гостя -->
                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <a href="{% url 'login' %}" class="btn btn-auth">Sign In</a>
                        <a href="{% url 'register' %}" class="btn btn-secondary" style="border-style: dashed; font-size: 13px;">
                            New here? Register
                        </a>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>

</body>
</html>
