<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему | TruckFix</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; }
        .login-card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .error { color: red; font-size: 0.8rem; text-align: center; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Вход для механика</h2>

    <!-- Самая важная часть: тег form -->
    <form method="post">
        <!-- Без этой строчки Django выдаст ошибку 403 -->
        {% csrf_token %}

        <!-- name="username" должен быть именно таким! -->
        <input type="text" name="username" placeholder="Ваш логин" required>

        <!-- name="password" должен быть именно таким! -->
        <input type="password" name="password" placeholder="Пароль" required>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <button type="submit">Войти на мостик</button>
    </form>

    <p style="text-align: center; font-size: 0.8rem; margin-top: 15px;">
        <a href="/">Назад на главную</a>
    </p>
</div>

</body>
</html>
