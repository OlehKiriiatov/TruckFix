<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — TruckFix</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #adbac7;
            --accent-blue: #58a6ff;
            --accent-green: #238636;
            --border-color: #30363d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .register-card {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        h2 { color: white; margin-bottom: 30px; font-size: 28px; text-align: center; }

        form p { margin-bottom: 20px; }

        label { display: block; margin-bottom: 8px; font-size: 14px; color: #768390; }

        input {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .helptext { display: block; font-size: 11px; color: #768390; margin-top: 5px; }

        .btn-register {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-green);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .btn-register:hover {
            background-color: #2ea043;
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            margin-top: 25px;
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <h2>Create Account</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-register">Register</button>
        </form>

        <a href="{% url 'login' %}" class="back-link">Already have an account? Sign In</a>
    </div>

</body>
</html>
