<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему | TruckFix</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            width: 100%;
            max-width: 360px;
            border: 1px solid #333;
        }
        h2 {
            text-align: center;
            color: #ff9800;
            margin-bottom: 24px;
            text-transform: uppercase;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #444;
            background: #2b2b2b;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #ff9800;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 16px;
        }
        .error-msg {
            color: #ff5252;
            background: rgba(255, 82, 82, 0.1);
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>TruckFix Login</h2>

        <!-- Форма отправляет данные на тот же URL методом POST -->
        <form method="POST">
            {% csrf_token %} <!-- Обязательный тег защиты Django -->

            {% if error %}
                <div class="error-msg">{{ error }}</div>
            {% endif %}

            <!-- Атрибуты name="username" и name="password" критически важны для views.py -->
            <input type="text" name="username" placeholder="Имя пользователя" required>
            <input type="password" name="password" placeholder="Пароль" required>

            <button type="submit">ВОЙТИ В СИСТЕМУ</button>
        </form>
    </div>

</body>
</html>
